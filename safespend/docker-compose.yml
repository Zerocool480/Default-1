# SafeSpend — full stack on any machine with Docker:
#   cp .env.example .env   (fill in JWT_SECRET at minimum)
#   docker compose up -d
#   open http://localhost:5001
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safespend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safespend_dev}
      POSTGRES_DB: safespend
    volumes:
      - safespend-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safespend']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '5001:5001'
    environment:
      DATABASE_URL: postgresql://safespend:${POSTGRES_PASSWORD:-safespend_dev}@db:5432/safespend
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 5001
      # Optional integrations — leave unset to run without them:
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_TOKEN_KEY: ${PLAID_TOKEN_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  safespend-db:
